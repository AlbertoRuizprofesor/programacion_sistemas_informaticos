# Configuración de la base de datos MySQL/MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/cursos2026?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configuración de JPA / Hibernate
# ddl-auto=none: No modifica la estructura de la base de datos existente
spring.jpa.hibernate.ddl-auto=none
# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Jackson (Formato JSON)
# Indenta el JSON de salida para que sea legible en el navegador
spring.jackson.serialization.indent_output=true

# Puerto por defecto
server.port=9090
